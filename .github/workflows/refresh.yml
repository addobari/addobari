name: Refresh profile

on:
  schedule:
    - cron: "17 21 * * *"   # 06:17 in Tokyo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli uharfbuzz

      - run: python scripts/update.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "Refresh profile"
          git pull --rebase
          git push

  header:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install fonttools brotli uharfbuzz cairosvg pillow

      - run: npm ci --prefix scripts/shader

      - name: Render today's header
        run: python scripts/header.py --chrome "$(which google-chrome)"

      # Force-push the renders to an orphan branch so daily images never pile up in history.
      - name: Publish to the output branch
        run: |
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Header for $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
